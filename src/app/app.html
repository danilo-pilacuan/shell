<header class="shell-header">
  <span class="shell-title">{{ title() }}</span>
  <nav>
    @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
    }
  </nav>
  <app-sesion-usuario class="sesion" />
</header>
@if (sinBackend()) {
  <ph-permission-banner
    class="shell-banner-api"
    titulo="Sin conexion con el backend"
    detalle="La app muestra datos locales de referencia en modo lectura; los cambios no se guardaran en el servidor hasta que el backend vuelva a responder."
    variante="warn"
  />
}
<main class="shell-content">
  <router-outlet />
</main>
